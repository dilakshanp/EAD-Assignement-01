plugins {
    id "com.android.application"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}
def mapsApiKey = localProperties.getProperty("MAPS_API_KEY", "YOUR_GOOGLE_MAPS_API_KEY")

android {
    namespace "com.sliit.solarmicrogrid"
    compileSdk 35

    defaultConfig {
        applicationId "com.sliit.solarmicrogrid"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        resValue "string", "google_maps_key", mapsApiKey
    }
}

dependencies {
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.google.android.gms:play-services-maps:19.0.0"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
}
